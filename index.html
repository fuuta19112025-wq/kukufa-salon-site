<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>くくふぁ</title>

  <style>
    body {
      margin: 0;
      font-family: "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
      line-height: 1.6;
      color: #333;
      background: #fafafa;
    }

    header {
      background: #d9cfc4;
      padding: 50px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 2rem;
      letter-spacing: 2px;
      font-weight: 500;
    }

    header p {
      margin-top: 10px;
      font-size: 0.95rem;
      color: #555;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 30px 20px;
    }

    section {
      background: #ffffff;
      margin-bottom: 25px;
      padding: 20px;
      border-radius: 12px;
    }

    h2 {
      margin-top: 0;
      font-size: 1.2rem;
      border-left: 4px solid #d9cfc4;
      padding-left: 10px;
      font-weight: 500;
    }

    .info p {
      margin: 6px 0;
    }

    .highlight {
      background: #f3eee9;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.95rem;
    }

    footer {
      text-align: center;
      padding: 20px;
      font-size: 0.85rem;
      color: #777;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 1.5rem;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>くくふぁ</h1>
    <p>静かに整う、小さな時間</p>
  </header>

  <div class="container">

    <section>
      <h2>お知らせ</h2>
      <p class="highlight">
        日々の疲れをゆるめる、静かな時間を大切にしています。
      </p>
    </section>

    <section>
      <h2>営業時間</h2>
      <div class="info">
        <p>月・水・木・金曜日　10:00〜19:00</p>
        <p>土・日曜日　　　　　10:00〜18:00</p>
        <p>定休日：火曜日</p>
      </div>
    </section>

    <section>
      <h2>ご予約・お問い合わせ</h2>
      <div class="info">
        <p>電話：070-9075-2880</p>
        <p>メール：cucufa.meguru@gmail.com</p>
      </div>
    </section>

    <section>
      <h2>コンセプト</h2>
      <p>
        なんでもない日を、少しだけ整える場所。<br/>
        香りと静けさの中で、自分に戻る時間を。
      </p>
    </section>

  </div>

  <footer>
    © くくふぁ
  </footer>

</body>
</html>
